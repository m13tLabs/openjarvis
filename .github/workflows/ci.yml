name: CI

on:
  push:
    branches: [develop]
  pull_request:
  merge_group:
  # allow manual action run
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ci:
    uses: m13tLabs/gh-actions-templates/.github/workflows/docker-ci.yml@main
    permissions:
      contents: read
      pull-requests: write
      checks: write
      packages: read
      attestations: write
    with:
      image_name: openjarvis
      dockerfiles: '["Dockerfile","Dockerfile.gpu"]'
      smoke_test: bash smoke_test.sh
      dockerhub: true
    secrets: inherit
